<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #faf9f7;
      color: #1a1714;
      border-radius: 12px;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 28px; height: 28px;
      background: rgba(232, 98, 42, 0.10);
      border: 1.5px solid rgba(232, 98, 42, 0.30);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      color: #1a1714;
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
    }
    .header-text p {
      font-size: 9.5px;
      color: #9a8f85;
      margin-top: 1px;
      letter-spacing: .02em;
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
    }

    .body {
      padding: 16px 18px;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 2px 0 14px;
    }

    .wish-card {
      background: rgba(232, 98, 42, 0.05);
      border: 1px solid rgba(232, 98, 42, 0.14);
      border-radius: 10px;
      padding: 12px 14px;
      position: relative;
      overflow: hidden;
    }
    .wish-card::before {
      content: '';
      position: absolute;
      top: -20px; right: -20px;
      width: 60px; height: 60px;
      background: radial-gradient(circle, rgba(232,98,42,0.07) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .wish-emoji {
      font-size: 18px;
      margin-bottom: 6px;
      display: block;
    }
    .wish-text {
      font-size: 10px;
      font-weight: 600;
      line-height: 1.6;
      color: #5a4f47;
      letter-spacing: .02em;
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
    }
    .wish-text strong {
      color: #e8622a;
      font-weight: 800;
    }

    .footer {
      padding: 8px 18px 14px;
      font-size: 8.5px;
      color: #c0b5aa;
      letter-spacing: .03em;
      text-align: center;
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">⚡</div>
    <div class="header-text">
      <h1 id="popup-h1">CLAUDE TRACKER</h1>
      <p id="popup-subtitle">Advanced Pro · v3.1</p>
    </div>
  </div>

  <div class="body">
    <div class="wish-card">
      <span class="wish-emoji">🤞</span>
      <div class="wish-text" id="popup-wish">
        May you <strong>never</strong> hit the 5h limit<br/>
        (you will). May your context window<br/>
        stay vast (it won't). And may every<br/>
        response be <strong>exactly</strong> what you asked.<br/>
        <span style="opacity:0.5;font-size:9px">(good luck with that last one)</span>
      </div>
    </div>
  </div>

  <div class="footer" id="popup-footer">CLAUDE ADVANCED PRO TRACKER — claude.ai</div>

  <script>
    // Apply i18n strings on load. Falls back to existing DOM content if getMessage fails.
    (function () {
      const g = key => {
        try { return chrome.i18n.getMessage(key) || null; } catch (e) { return null; }
      };
      const set = (id, text, useHTML) => {
        const el = document.getElementById(id);
        if (!el || !text) return;
        if (useHTML) el.innerHTML = text; else el.textContent = text;
      };
      set('popup-h1',       g('popupH1'));
      set('popup-subtitle', g('popupSubtitle'));
      set('popup-wish',     g('popupWishText'), true);
      set('popup-footer',   g('popupFooter'));
    })();
  </script>

</body>
</html>
