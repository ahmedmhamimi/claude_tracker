<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokenLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <img src="icons/icon48.png" width="36" height="36" alt="">
      <div class="brand">
        <h1>TokenLens</h1>
        <span class="ver" id="ver"></span>
      </div>
    </header>

    <section class="status" id="status" data-state="checking">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text"></span>
    </section>

    <section class="usage" id="usage" hidden>
      <div class="row">
        <div class="row-head">
          <span class="label" data-i18n="quota5hLabel">5-Hour Limit</span>
          <span class="pct" id="pct-5h">0%</span>
        </div>
        <div class="bar"><div class="fill" id="fill-5h"></div></div>
        <div class="reset" id="reset-5h"></div>
      </div>
      <div class="row">
        <div class="row-head">
          <span class="label" data-i18n="quota7dLabel">7-Day Limit</span>
          <span class="pct" id="pct-7d">0%</span>
        </div>
        <div class="bar"><div class="fill" id="fill-7d"></div></div>
        <div class="reset" id="reset-7d"></div>
      </div>
    </section>

    <p class="loading" id="loading" hidden data-i18n="popupLoading">Loading your usage…</p>

    <button class="action" id="action" type="button" hidden></button>

    <footer>
      <p class="privacy" data-i18n="privacyLine">Runs only on claude.ai. Nothing leaves your browser.</p>
      <p class="wish" data-i18n="popupWish">May your limits stay far away.</p>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
