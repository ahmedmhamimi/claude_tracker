<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokenLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <img src="icons/icon48.png" width="36" height="36" alt="">
      <div class="brand">
        <h1>TokenLens</h1>
        <span class="ver" id="ver"></span>
      </div>
    </header>

    <section class="status" id="status" data-state="checking">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text"></span>
    </section>

    <section class="usage" id="usage" hidden>
      <div class="row">
        <div class="row-head">
          <span class="label" data-i18n="quota5hLabel">5-Hour Limit</span>
          <span class="pct" id="pct-5h">0%</span>
        </div>
        <div class="bar"><div class="fill" id="fill-5h"></div></div>
        <div class="reset" id="reset-5h"></div>
      </div>
      <div class="row">
        <div class="row-head">
          <span class="label" data-i18n="quota7dLabel">7-Day Limit</span>
          <span class="pct" id="pct-7d">0%</span>
        </div>
        <div class="bar"><div class="fill" id="fill-7d"></div></div>
        <div class="reset" id="reset-7d"></div>
      </div>
    </section>

    <p class="loading" id="loading" hidden data-i18n="popupLoading">Loading your usage…</p>

    <button class="action" id="action" type="button" hidden></button>

    <section class="pro" id="pro" hidden>
      <span class="pro-text" id="pro-text"></span>
      <button class="pro-btn" id="pro-btn" type="button" hidden></button>
    </section>

    <a class="vamimi" id="vamimi" href="https://www.vamimi.com/?utm_source=tokenlens&amp;utm_medium=extension&amp;utm_campaign=popup" target="_blank" rel="noopener">
      <span class="vm-tile" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="7" height="5" rx="1.6"/><rect x="14" y="3.5" width="7" height="5" rx="1.6"/><rect x="8.5" y="15.5" width="7" height="5" rx="1.6"/><path d="M6.5 8.5v2.5a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5V8.5"/><path d="M12 12.5v3"/></svg>
      </span>
      <span class="vm-txt"><b>VamimiAI</b><small data-i18n="vm_popupSub">Turn any Claude reply into a diagram</small></span>
      <svg class="vm-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </a>

    <button class="settings-btn" id="settings-btn" type="button" data-i18n="vm_popupSettings">Settings: choose what TokenLens shows</button>

    <footer>
      <p class="privacy" data-i18n="privacyLine">Runs only on claude.ai. Your chats never leave your browser.</p>
      <p class="wish" data-i18n="popupWish">May your limits stay far away.</p>
    </footer>
  </main>

  <script src="license-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
